ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:8443
ServerName clinica.test:8443
PidFile "__VOSK_RUNTIME__/httpd.pid"

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule alias_module modules/mod_alias.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libpq.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPINIDir "C:/xampp/php"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
AddType text/html .php
TypesConfig "C:/xampp/apache/conf/mime.types"
DirectoryIndex index.php
AccessFileName .htaccess

ErrorLog "__VOSK_RUNTIME__/apache-error.log"
LogLevel warn
LogFormat "%h %t %m %U %>s %b" diagnostic_local
CustomLog "__VOSK_RUNTIME__/apache-access.log" diagnostic_local

DocumentRoot "C:/xampp/htdocs/clinica-dolor/public"
Alias /assets/ "C:/xampp/htdocs/clinica-dolor/public/assets/"
Alias /public/assets/ "C:/xampp/htdocs/clinica-dolor/public/assets/"

<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "C:/xampp/htdocs/clinica-dolor/public">
    AllowOverride None
    Options FollowSymLinks
    Require local
    php_admin_value display_errors Off
    php_admin_value log_errors On
    php_admin_value error_log "__VOSK_RUNTIME__/php-error.log"
    php_admin_value session.name VOSKDIAGNOSTIC
    php_admin_value session.save_path "__VOSK_RUNTIME__/sessions"
    php_admin_value upload_tmp_dir "__VOSK_RUNTIME__/tmp"
    php_admin_value sys_temp_dir "__VOSK_RUNTIME__/tmp"
</Directory>
<Directory "C:/xampp/htdocs/clinica-dolor/public/assets">
    AllowOverride None
    Options -Indexes -ExecCGI
    Require local
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</Directory>

SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
SSLHonorCipherOrder on
SSLSessionCache "shmcb:__VOSK_RUNTIME__/ssl_scache(512000)"
SSLSessionCacheTimeout 300

<VirtualHost 127.0.0.1:8443>
    ServerName clinica.test:8443
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD|POST)$
    RewriteRule ^ - [R=404,L]
    RewriteCond %{REQUEST_METHOD} ^POST$
    RewriteCond %{REQUEST_URI} !^/historia-clinica/(?:diagnostico-voz/ticket|login)$
    RewriteRule ^ - [R=404,L]
    RewriteCond %{REQUEST_METHOD} !^POST$
    RewriteRule ^historia-clinica/(?:diagnostico-voz/ticket|login)$ - [R=404,L]
    RewriteRule ^/?historia-clinica/(?:diagnostico-voz(?:/ticket)?|acceso|login)$ /index.php [END,QSA]
    RewriteRule ^/?(?:assets/(?:css|js|images)/[A-Za-z0-9_./-]+|public/assets/(?:css|js|images)/[A-Za-z0-9_./-]+)$ - [END]
    RewriteRule ^/?index\.php$ - [END]
    RewriteRule ^ - [R=404,L]
    SSLEngine on
    SSLCertificateFile "__VOSK_CERT__"
    SSLCertificateKeyFile "__VOSK_CERT_KEY__"
    SetEnv CLINICA_VOSK_ORIGIN "https://clinica.test:8443"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
</VirtualHost>
