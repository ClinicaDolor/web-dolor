ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:8443
ServerName clinica.test:8443
PidFile "__VOSK_RUNTIME__/httpd.pid"

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule alias_module modules/mod_alias.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libpq.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPINIDir "C:/xampp/php"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
AddType text/html .php
TypesConfig "C:/xampp/apache/conf/mime.types"
DirectoryIndex index.php
AccessFileName .htaccess

ErrorLog "__VOSK_RUNTIME__/apache-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" vosk_local
CustomLog "__VOSK_RUNTIME__/apache-access.log" vosk_local

DocumentRoot "C:/xampp/htdocs/clinica-dolor"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "C:/xampp/htdocs/clinica-dolor">
    AllowOverride All
    Options FollowSymLinks
    Require local
    php_admin_value auto_prepend_file "C:/xampp/htdocs/clinica-dolor/tests/m07-http-isolated/web-database-preflight.php"
    php_admin_value display_errors Off
    php_admin_value log_errors On
    php_admin_value error_log "__VOSK_RUNTIME__/php-error.log"
    php_admin_value session.name VOSKLOCAL
    php_admin_value session.save_path "__VOSK_RUNTIME__/sessions"
    php_admin_value upload_tmp_dir "__VOSK_RUNTIME__/tmp"
    php_admin_value sys_temp_dir "__VOSK_RUNTIME__/tmp"
</Directory>
<Directory "C:/xampp/htdocs/clinica-dolor/tests/m07-http-isolated">
    Require all denied
</Directory>

<VirtualHost 127.0.0.1:8443>
    ServerName clinica.test:8443
    SSLEngine on
    SSLCertificateFile "__VOSK_CERT__"
    SSLCertificateKeyFile "__VOSK_CERT_KEY__"
    SetEnv CLINICA_VOSK_ROOT "__VOSK_ROOT__"
    SetEnv CLINICA_VOSK_ORIGIN "https://clinica.test:8443"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
