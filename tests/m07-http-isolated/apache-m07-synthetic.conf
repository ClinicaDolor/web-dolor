# Template resolved by start-m07-apache.ps1. It is never loaded by the main
# XAMPP Apache instance and contains no credentials.
ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:__M07_PORT__
ServerName 127.0.0.1:__M07_PORT__
PidFile "__M07_RUNTIME__/httpd.pid"

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule alias_module modules/mod_alias.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so

Include "C:/xampp/apache/conf/extra/httpd-xampp.conf"

TypesConfig "C:/xampp/apache/conf/mime.types"
DirectoryIndex index.php
AccessFileName .htaccess

ErrorLog "__M07_RUNTIME__/apache-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" m07_common
CustomLog "__M07_RUNTIME__/apache-access.log" m07_common

DocumentRoot "__M07_ROOT__"

<Directory "__M07_ROOT__">
    AllowOverride All
    Options FollowSymLinks
    Require local

    # This is scoped to the isolated process only. The main php.ini remains
    # unchanged and the prepend file is not directly web-accessible.
    php_admin_value auto_prepend_file "__M07_PREPEND__"
    php_admin_value display_errors Off
    php_admin_value log_errors On
    php_admin_value error_log "__M07_RUNTIME__/php-error.log"
    php_admin_value session.name M07SYNTHETIC
    php_admin_value session.save_path "__M07_RUNTIME__/sessions"
    php_admin_value upload_tmp_dir "__M07_RUNTIME__/tmp"
    php_admin_value sys_temp_dir "__M07_RUNTIME__/tmp"
</Directory>

<Directory "__M07_ROOT__/tests/m07-http-isolated">
    Require all denied
</Directory>
